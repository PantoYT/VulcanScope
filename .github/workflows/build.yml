name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [ win-x64, linux-x64, osx-arm64 ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish single-file (${{ matrix.rid }})
        run: >
          dotnet publish csharp -c Release -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:DebugSymbols=false
          -o publish/${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: vulcanscope-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}/
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect binaries
        run: |
          mkdir -p release
          cp "artifacts/vulcanscope-win-x64/vulcanscope.exe" "release/vulcanscope-win-x64.exe"
          cp "artifacts/vulcanscope-linux-x64/vulcanscope"    "release/vulcanscope-linux-x64"
          cp "artifacts/vulcanscope-osx-arm64/vulcanscope"    "release/vulcanscope-osx-arm64"
          ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
