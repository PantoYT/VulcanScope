<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VulcanScope — Dziennik</title>
<style>
  :root{
    /* Aurora — light theme (default) */
    --bg:#e8ebfb;
    --txt:#1a1f37; --muted:#5b6488; --faint:#8b93b4;
    --panel:rgba(255,255,255,.60); --panel2:rgba(255,255,255,.85);
    --border:rgba(255,255,255,.80); --border2:rgba(124,108,255,.32);
    --line:rgba(30,30,70,.09); --track:rgba(30,30,70,.08);
    --a1:#7c6cff; --a2:#b95cff; --a3:#ff74b8; --a4:#56c5ff;
    --accent:#7c6cff; --accent2:#5ab0ff; --accent3:#b95cff;
    --grad:linear-gradient(135deg,#7c6cff,#ff74b8); --grad-cool:linear-gradient(135deg,#7c6cff,#56c5ff);
    --on-grad:#ffffff;
    --g6:#15a34a; --g5:#22c55e; --g4:#84cc16; --g3:#eab308; --g2:#f97316; --g1:#ef4444; --g-none:#94a0c0;
    --ok:#16a34a; --warn:#f59e0b; --bad:#ef4444; --info:#3b82f6;
    --radius:18px;
    --shadow:0 24px 50px -20px rgba(70,55,150,.45); --shadow-sm:0 12px 30px -16px rgba(70,55,150,.30);
    --blur:blur(22px) saturate(165%);
    --font:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,'Cascadia Code','Consolas',monospace;
  }
  [data-theme="midnight"]{
    --bg:#080b16;
    --txt:#e9edfb; --muted:#9aa6c8; --faint:#69739a;
    --panel:rgba(255,255,255,.045); --panel2:rgba(255,255,255,.07);
    --border:rgba(255,255,255,.10); --border2:rgba(124,108,255,.45);
    --line:rgba(255,255,255,.08); --track:rgba(255,255,255,.09);
    --g-none:#5b6b86; --info:#38bdf8;
    --shadow:0 24px 50px -20px rgba(0,0,0,.65); --shadow-sm:0 12px 30px -16px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:var(--font);color:var(--txt);background:var(--bg);-webkit-font-smoothing:antialiased;overflow-x:hidden}
  body::before{content:'';position:fixed;inset:-25%;z-index:-2;pointer-events:none;
    background:
      radial-gradient(38% 38% at 18% 22%, rgba(124,108,255,.55), transparent 62%),
      radial-gradient(40% 40% at 82% 14%, rgba(255,116,184,.50), transparent 62%),
      radial-gradient(46% 46% at 78% 82%, rgba(86,197,255,.50), transparent 62%),
      radial-gradient(40% 40% at 22% 86%, rgba(185,92,255,.42), transparent 62%);
    filter:blur(30px);animation:drift 24s ease-in-out infinite alternate}
  [data-theme="midnight"] body::before{opacity:.5}
  @keyframes drift{0%{transform:translate3d(0,0,0) scale(1)}100%{transform:translate3d(0,-4%,0) scale(1.1)}}
  a{color:inherit}
  ::-webkit-scrollbar{width:11px;height:11px}
  ::-webkit-scrollbar-thumb{background:var(--track);border-radius:10px;border:3px solid transparent;background-clip:padding-box}
  ::-webkit-scrollbar-thumb:hover{background:var(--muted);background-clip:padding-box}

  .app{display:grid;grid-template-columns:256px 1fr;min-height:100vh}

  /* Sidebar */
  .side{position:sticky;top:0;height:100vh;padding:22px 16px;display:flex;flex-direction:column;gap:6px;
    background:var(--panel);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-right:1px solid var(--border)}
  .brand{display:flex;align-items:center;gap:12px;padding:6px 8px 20px}
  .logo{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-weight:900;color:var(--on-grad);
    background:var(--grad);box-shadow:0 10px 22px -8px var(--a2)}
  .brand b{font-size:18px;letter-spacing:.2px}
  .brand span{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:2px}
  .nav{display:flex;flex-direction:column;gap:3px;margin-top:4px}
  .nav button{display:flex;align-items:center;gap:12px;width:100%;border:0;cursor:pointer;text-align:left;
    padding:11px 13px;border-radius:12px;background:transparent;color:var(--muted);font-size:14px;font-weight:600;
    font-family:inherit;transition:.18s}
  .nav button svg{width:18px;height:18px;opacity:.85;flex:none}
  .nav button:hover{background:var(--panel2);color:var(--txt)}
  .nav button.active{background:var(--grad);color:var(--on-grad);box-shadow:0 12px 26px -10px var(--a2)}
  .nav button.active svg{opacity:1}
  .nav .badge{margin-left:auto;font-size:11px;background:rgba(255,255,255,.25);padding:2px 8px;border-radius:20px;color:inherit;font-weight:700}
  .nav button:not(.active) .badge{background:var(--track);color:var(--muted)}
  .side .foot{margin-top:auto;font-size:11px;color:var(--faint);padding:10px 8px;line-height:1.6}

  /* Main */
  .main{padding:28px 34px 70px;max-width:1320px;width:100%}
  .topbar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:28px}
  .avatar{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-weight:800;font-size:20px;color:var(--on-grad);
    background:var(--grad);box-shadow:var(--shadow-sm)}
  .who h1{margin:0;font-size:24px;letter-spacing:.2px;font-weight:800}
  .who p{margin:4px 0 0;color:var(--muted);font-size:13px}
  .top-right{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .chip{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:14px;background:var(--panel);
    backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--border);font-size:13px;color:var(--muted);box-shadow:var(--shadow-sm)}
  .chip b{color:var(--txt)}
  .chip.btn{cursor:pointer;user-select:none;transition:.18s}
  .chip.btn:hover{border-color:var(--border2);transform:translateY(-2px)}
  .chip.lucky{background:linear-gradient(135deg,rgba(34,197,94,.20),rgba(132,204,22,.12));border-color:rgba(132,204,22,.4)}
  .chip.lucky b{color:#15803d;font-size:16px}
  [data-theme="midnight"] .chip.lucky b{color:#bef264}

  h2.view-title{font-size:12px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin:0 0 18px;font-weight:800}
  .view{display:none;animation:fade .4s cubic-bezier(.22,1,.36,1)}
  .view.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .grid{display:grid;gap:16px}
  .cards{grid-template-columns:repeat(auto-fill,minmax(195px,1fr))}
  .card,.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--shadow-sm)}
  .card{padding:18px;position:relative;overflow:hidden;transition:transform .25s cubic-bezier(.22,1,.36,1),box-shadow .25s,border-color .25s}
  .panel{padding:22px;transition:border-color .25s,box-shadow .25s}
  .card:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--border2)}
  .panel:hover{box-shadow:var(--shadow);border-color:var(--border2)}
  .card.stat::before{content:'';position:absolute;inset:0 0 auto 0;height:3px;background:var(--grad)}
  .stat .k{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.2px}
  .stat .v{font-size:32px;font-weight:800;margin-top:8px;line-height:1;letter-spacing:-.5px}
  .stat .s{font-size:12px;color:var(--faint);margin-top:7px}
  .stat .ic{position:absolute;right:14px;top:16px;width:30px;height:30px;opacity:.16}
  .stat .ic svg{width:30px;height:30px}

  .panel h3{margin:0 0 16px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:9px}
  .panel h3 .dot{width:9px;height:9px;border-radius:50%;background:var(--grad)}
  .two{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
  .three{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}

  /* Grade pill */
  .pill{display:inline-grid;place-items:center;min-width:31px;height:31px;padding:0 7px;border-radius:10px;color:#06210f;
    font-weight:800;font-size:14px;box-shadow:0 6px 14px -4px rgba(0,0,0,.35);cursor:default;transition:transform .15s}
  .pill:hover{transform:translateY(-2px) scale(1.06)}
  .pill.lg{min-width:40px;height:40px;font-size:17px;border-radius:12px}
  .pills{display:flex;flex-wrap:wrap;gap:7px}

  .subj-row{display:grid;grid-template-columns:220px 70px 1fr;grid-template-areas:'n a g';gap:14px;align-items:center;padding:15px 0;border-bottom:1px solid var(--line)}
  .subj-row:last-child{border-bottom:0}
  .subj-name{font-weight:700;font-size:14px}
  .subj-meta{font-size:12px;color:var(--faint);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap}
  .subj-meta .tag{padding:2px 8px;border-radius:7px;background:var(--track)}
  .avg-badge{font-weight:800;font-size:19px;text-align:center}

  .row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .row .lead{font-weight:700;font-size:14px}
  .row .sub{font-size:12px;color:var(--muted)}
  .row .right{margin-left:auto;text-align:right}
  .muted{color:var(--muted)} .faint{color:var(--faint)}
  .badge2{font-size:11px;padding:4px 10px;border-radius:20px;background:var(--track);color:var(--muted);font-weight:700;white-space:nowrap}
  .badge2.soon{background:rgba(245,158,11,.18);color:#b45309}
  .badge2.today{background:rgba(239,68,68,.18);color:#b91c1c}
  .badge2.done{background:rgba(22,163,74,.16);color:#15803d}
  [data-theme="midnight"] .badge2.soon{color:#fcd34d}
  [data-theme="midnight"] .badge2.today{color:#fca5a5}
  [data-theme="midnight"] .badge2.done{color:#86efac}

  .tabs{display:inline-flex;gap:4px;background:var(--panel);border:1px solid var(--border);padding:5px;border-radius:14px;margin-bottom:18px;
    backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--shadow-sm)}
  .tabs button{border:0;background:transparent;color:var(--muted);font-family:inherit;font-weight:700;font-size:13px;
    padding:8px 18px;border-radius:10px;cursor:pointer;transition:.18s}
  .tabs button:hover{color:var(--txt)}
  .tabs button.active{background:var(--grad);color:var(--on-grad);box-shadow:0 10px 22px -10px var(--a2)}

  /* dot subject color tag */
  .sdot{width:10px;height:10px;border-radius:3px;flex:none}

  /* Timetable */
  .tt-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .tt-head .nav-btn{width:36px;height:36px;border-radius:11px;border:1px solid var(--border);background:var(--panel);
    color:var(--txt);cursor:pointer;font-size:16px;display:grid;place-items:center;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);transition:.18s}
  .tt-head .nav-btn:hover{border-color:var(--border2);transform:translateY(-2px)}
  .tt-grid{display:grid;gap:10px;overflow-x:auto;padding-bottom:6px}
  .tt-col{min-width:155px}
  .tt-day{font-weight:800;font-size:13px;padding:9px 10px;border-radius:12px;background:var(--panel);border:1px solid var(--border);text-align:center;margin-bottom:10px}
  .tt-day.today{background:var(--grad);color:var(--on-grad);border-color:transparent}
  .tt-day small{display:block;color:var(--muted);font-weight:500;font-size:11px}
  .tt-day.today small{color:rgba(255,255,255,.85)}
  .lesson{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--a1);border-radius:12px;
    padding:9px 11px;margin-bottom:8px;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);transition:transform .15s}
  .lesson:hover{transform:translateX(2px)}
  .lesson .t{font-size:11px;color:var(--faint);font-family:var(--mono)}
  .lesson .n{font-weight:700;font-size:13px;margin:3px 0}
  .lesson .m{font-size:11px;color:var(--muted)}
  .lesson.cancel{border-left-color:var(--bad);opacity:.65}
  .lesson.cancel .n{text-decoration:line-through;color:var(--muted)}
  .lesson.subst{border-left-color:var(--warn)}
  .lesson .flag{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-top:4px}
  .lesson.cancel .flag{color:var(--bad)} .lesson.subst .flag{color:var(--warn)}

  /* table */
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:9px 10px;border-bottom:1px solid var(--line)}
  td{padding:11px 10px;border-bottom:1px solid var(--line)}
  tbody tr{transition:.12s}
  tr:hover td{background:var(--panel2)}
  .bar{height:8px;border-radius:6px;background:var(--track);overflow:hidden;min-width:80px}
  .bar>span{display:block;height:100%;border-radius:6px;width:0;transition:width 1.1s cubic-bezier(.22,1,.36,1)}

  .note-card{border-radius:16px;padding:18px;border:1px solid var(--border);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
    box-shadow:var(--shadow-sm);transition:transform .25s,box-shadow .25s}
  .note-card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
  .note-card.pos{background:linear-gradient(150deg,rgba(34,197,94,.18),var(--panel));border-color:rgba(34,197,94,.35)}
  .note-card.neg{background:linear-gradient(150deg,rgba(239,68,68,.16),var(--panel));border-color:rgba(239,68,68,.35)}
  .note-card .cat{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px}
  .note-card.pos .cat{color:#15803d} .note-card.neg .cat{color:#b91c1c}
  [data-theme="midnight"] .note-card.pos .cat{color:#86efac}
  [data-theme="midnight"] .note-card.neg .cat{color:#fca5a5}
  .note-card .body{margin:10px 0;font-size:14px;line-height:1.55}

  .empty{padding:44px;text-align:center;color:var(--faint);font-size:14px}
  .locked{display:flex;flex-direction:column;align-items:center;gap:14px;padding:54px 20px;text-align:center}
  .locked svg{width:48px;height:48px;opacity:.45}
  .locked b{font-size:16px} .locked p{color:var(--muted);max-width:460px;margin:0;line-height:1.6}

  .search{width:100%;padding:12px 16px;border-radius:13px;border:1px solid var(--border);background:var(--panel);
    backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);color:var(--txt);font-family:inherit;font-size:14px;margin-bottom:16px}
  .search::placeholder{color:var(--faint)}
  .search:focus{outline:none;border-color:var(--a1);box-shadow:0 0 0 4px rgba(124,108,255,.18)}

  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:14px}
  .legend i{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}

  @media(max-width:880px){
    .app{grid-template-columns:1fr}
    .side{position:fixed;z-index:20;left:-280px;transition:.25s;width:264px}
    .side.open{left:0}
    .two,.three{grid-template-columns:1fr}
    .subj-row{grid-template-columns:1fr 60px;grid-template-areas:'n a' 'g g'}
    .menu-btn{display:grid!important}
    .main{padding:64px 18px 60px}
  }
  .menu-btn{display:none;position:fixed;top:16px;left:16px;z-index:30;width:44px;height:44px;border-radius:13px;
    border:1px solid var(--border);background:var(--panel);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);color:var(--txt);cursor:pointer;place-items:center;box-shadow:var(--shadow-sm)}
</style>
</head>
<body>
<button class="menu-btn" id="menuBtn">☰</button>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <div class="logo">V</div>
      <div><b>VulcanScope</b><span>eduVulcan • dziennik</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot" id="foot"></div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="avatar" id="avatar">?</div>
      <div class="who">
        <h1 id="who-name">—</h1>
        <p id="who-sub">—</p>
      </div>
      <div class="top-right" id="top-right"></div>
    </div>
    <div id="views"></div>
  </main>
</div>

<script>
const DATA = /*__DATA__*/null/*__DATA__*/;

// ---------- helpers ----------
const $ = (s,r=document)=>r.querySelector(s);
function el(tag, attrs={}, kids=[]){
  const e=document.createElement(tag);
  for(const[k,v]of Object.entries(attrs)){
    if(k==='class')e.className=v;
    else if(k==='html')e.innerHTML=v;
    else if(k==='text')e.textContent=v;
    else if(k.startsWith('on')&&typeof v==='function')e.addEventListener(k.slice(2),v);
    else if(v!==null&&v!==undefined)e.setAttribute(k,v);
  }
  (Array.isArray(kids)?kids:[kids]).forEach(c=>{if(c==null)return;e.appendChild(typeof c==='string'?document.createTextNode(c):c)});
  return e;
}
const PL_DAYS=['Poniedziałek','Wtorek','Środa','Czwartek','Piątek','Sobota','Niedziela'];
const PL_DAYS_S=['Pon','Wt','Śr','Czw','Pt','Sob','Nd'];
const PL_MON=['sty','lut','mar','kwi','maj','cze','lip','sie','wrz','paź','lis','gru'];
function pd(s){return s?new Date(s+'T00:00:00'):null}
function fmtD(s){const d=pd(s);if(!d)return'—';return `${d.getDate()} ${PL_MON[d.getMonth()]} ${d.getFullYear()}`}
function fmtDShort(s){const d=pd(s);if(!d)return'—';return `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}`}
function weekday(s){const d=pd(s);return d?(d.getDay()+6)%7:0}
function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function todayISO(){return iso(new Date())}
function daysBetween(a,b){return Math.round((pd(b)-pd(a))/864e5)}

function gradeNumeric(g){
  let v=g.value;
  if(typeof v!=='number'||v<=0||v>6)return null;
  const c=(g.content||'').trim();
  if(c.endsWith('+'))v+=0.5;else if(c.endsWith('-'))v-=0.25;
  return v;
}
function colorFor(v){
  if(v==null)return'var(--g-none)';
  if(v>=5.5)return'var(--g6)';if(v>=4.5)return'var(--g5)';if(v>=3.5)return'var(--g4)';
  if(v>=2.5)return'var(--g3)';if(v>=1.5)return'var(--g2)';return'var(--g1)';
}
function gradeColor(g){return colorFor(gradeNumeric(g))}
// stable subject color from name
function subjColor(name){let h=0;for(let i=0;i<name.length;i++)h=(h*31+name.charCodeAt(i))>>>0;return `hsl(${h%360} 70% 62%)`}

const ICONS={
  overview:'<path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/>',
  grades:'<path d="M4 4h16v4H4zM4 10h16v4H4zM4 16h10v4H4z"/>',
  attend:'<path d="M9 16.2l-3.5-3.5L4 14.2 9 19.2 20 8.2l-1.5-1.5z"/>',
  plan:'<path d="M7 2v3M17 2v3M3 8h18M5 5h14a1 1 0 011 1v14a1 1 0 01-1 1H5a1 1 0 01-1-1V6a1 1 0 011-1z" fill="none" stroke="currentColor" stroke-width="2"/>',
  exam:'<path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8zm0 0v6h6"/>',
  hw:'<path d="M12 2L2 7l10 5 10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>',
  note:'<path d="M4 4h16v12H7l-3 3z"/>',
  msg:'<path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>',
  lock:'<path d="M6 10V8a6 6 0 1112 0v2M5 10h14v11H5z" fill="none" stroke="currentColor" stroke-width="2"/>',
  star:'<path d="M12 2l3 6.5 7 .9-5 4.9 1.3 7L12 18l-6.3 3.3L7 14.3 2 9.4l7-.9z"/>',
  clock:'<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="2"/>'
};
function icon(name,cls=''){return `<svg class="${cls}" viewBox="0 0 24 24" fill="currentColor">${ICONS[name]||''}</svg>`}

// ---------- charts ----------
function barChart(items){ // items: [{label,value,color,max?}]
  const max=Math.max(...items.map(i=>i.max??i.value),1);
  const wrap=el('div',{class:'grid',style:'gap:9px'});
  const spans=[];
  items.forEach(i=>{
    const pct=Math.max(2,(i.value/max)*100);
    const span=el('span',{style:`background:${i.color}`});
    spans.push([span,pct]);
    wrap.appendChild(el('div',{style:'display:grid;grid-template-columns:130px 1fr 44px;gap:10px;align-items:center'},[

      el('div',{class:'bar'},[span]),

    ]));
  });
  requestAnimationFrame(()=>requestAnimationFrame(()=>spans.forEach(([s,p])=>{s.style.width=p+'%'})));

}
function donut(segs,centerTop,centerBot){ // segs:[{value,color,label}]
  const total=segs.reduce((s,x)=>s+x.value,0)||1;
  const R=54,C=2*Math.PI*R;let off=0;
  const ns='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 140 140');svg.setAttribute('width','150');svg.setAttribute('height','150');
  const bg=document.createElementNS(ns,'circle');
  bg.setAttribute('cx','70');bg.setAttribute('cy','70');bg.setAttribute('r',R);bg.setAttribute('fill','none');
  bg.setAttribute('stroke','var(--track)');bg.setAttribute('stroke-width','16');svg.appendChild(bg);
  const anims=[];
  segs.forEach(s=>{
    if(s.value<=0)return;
    const len=C*(s.value/total);
    const c=document.createElementNS(ns,'circle');
    c.setAttribute('cx','70');c.setAttribute('cy','70');c.setAttribute('r',R);c.setAttribute('fill','none');
    c.setAttribute('stroke',s.color);c.setAttribute('stroke-width','16');
    c.setAttribute('stroke-dashoffset',-off);
    c.setAttribute('transform','rotate(-90 70 70)');c.setAttribute('stroke-linecap','butt');
    c.style.strokeDasharray=`0 ${C}`;c.style.transition='stroke-dasharray 1s cubic-bezier(.22,1,.36,1)';
    svg.appendChild(c);anims.push([c,len]);off+=len;
  });
  requestAnimationFrame(()=>requestAnimationFrame(()=>anims.forEach(([c,len])=>{c.style.strokeDasharray=`${len} ${C-len}`})));
  const wrap=el('div',{style:'position:relative;width:150px;height:150px'});
  wrap.appendChild(svg);
  wrap.appendChild(el('div',{style:'position:absolute;inset:0;display:grid;place-items:center;text-align:center'},[
    el('div',{},[el('div',{style:'font-size:26px;font-weight:800',text:centerTop}),
                 el('div',{class:'faint',style:'font-size:11px',text:centerBot})])
  ]));
  return wrap;
}

let _agId=0;
function areaChart(points){ // points:[{label,value}] value 1..6 — animated line+area
  const ns='http://www.w3.org/2000/svg',w=560,h=160,pad={l:26,r:14,t:14,b:22};
  if(points.length<2)return el('div',{class:'empty',text:'Za mało danych'});
  const vals=points.map(p=>p.value);
  const min=Math.max(1,Math.floor(Math.min(...vals)-0.3)), max=Math.min(6,Math.ceil(Math.max(...vals)+0.3));
  const X=i=>pad.l+i/(points.length-1)*(w-pad.l-pad.r);
  const Y=v=>pad.t+(1-(v-min)/((max-min)||1))*(h-pad.t-pad.b);
  const svg=document.createElementNS(ns,'svg');
  svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.setAttribute('width','100%');svg.setAttribute('preserveAspectRatio','none');svg.style.height=h+'px';svg.style.display='block';
  for(let g=min;g<=max;g++){
    const y=Y(g);
    const ln=document.createElementNS(ns,'line');ln.setAttribute('x1',pad.l);ln.setAttribute('x2',w-pad.r);ln.setAttribute('y1',y);ln.setAttribute('y2',y);
    ln.setAttribute('stroke','var(--line)');ln.setAttribute('stroke-width','1');svg.appendChild(ln);
    const tx=document.createElementNS(ns,'text');tx.setAttribute('x','2');tx.setAttribute('y',y+3);tx.setAttribute('fill','var(--faint)');tx.setAttribute('font-size','9');tx.textContent=g;svg.appendChild(tx);
  }
  const id='ag'+(++_agId);
  const defs=document.createElementNS(ns,'defs');
  const lg=document.createElementNS(ns,'linearGradient');lg.setAttribute('id',id);lg.setAttribute('x1','0');lg.setAttribute('y1','0');lg.setAttribute('x2','0');lg.setAttribute('y2','1');
  const s1=document.createElementNS(ns,'stop');s1.setAttribute('offset','0');s1.setAttribute('stop-color','#7c6cff');s1.setAttribute('stop-opacity','0.42');
  const s2=document.createElementNS(ns,'stop');s2.setAttribute('offset','1');s2.setAttribute('stop-color','#7c6cff');s2.setAttribute('stop-opacity','0');
  lg.appendChild(s1);lg.appendChild(s2);defs.appendChild(lg);svg.appendChild(defs);
  const line=points.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(p.value).toFixed(1)}`).join(' ');
  const area=`${line} L${X(points.length-1).toFixed(1)} ${h-pad.b} L${X(0).toFixed(1)} ${h-pad.b} Z`;
  const ap=document.createElementNS(ns,'path');ap.setAttribute('d',area);ap.setAttribute('fill',`url(#${id})`);ap.style.opacity='0';ap.style.transition='opacity 1s ease .3s';svg.appendChild(ap);
  const lp=document.createElementNS(ns,'path');lp.setAttribute('d',line);lp.setAttribute('fill','none');lp.setAttribute('stroke','#7c6cff');lp.setAttribute('stroke-width','2.5');lp.setAttribute('stroke-linejoin','round');lp.setAttribute('stroke-linecap','round');
  lp.setAttribute('pathLength','1');lp.style.strokeDasharray='1';lp.style.strokeDashoffset='1';lp.style.transition='stroke-dashoffset 1.3s cubic-bezier(.22,1,.36,1)';svg.appendChild(lp);
  const last=points[points.length-1];
  const dot=document.createElementNS(ns,'circle');dot.setAttribute('cx',X(points.length-1));dot.setAttribute('cy',Y(last.value));dot.setAttribute('r','4');dot.setAttribute('fill','#7c6cff');dot.setAttribute('stroke','#fff');dot.setAttribute('stroke-width','2');dot.style.opacity='0';dot.style.transition='opacity .4s ease 1s';svg.appendChild(dot);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{lp.style.strokeDashoffset='0';ap.style.opacity='1';dot.style.opacity='1';}));
  return el('div',{},[svg]);
}

// count-up animation for a numeric text node
function countUp(node){
  const txt=(node.textContent||'').trim();
  const m=txt.match(/^(-?\d+(?:[.,]\d+)?)(.*)$/);
  if(!m)return;
  const numStr=m[1], suffix=m[2], target=parseFloat(numStr.replace(',','.'));
  const decimals=(numStr.split(/[.,]/)[1]||'').length, dur=850, t0=performance.now();
  node.textContent='0'+(decimals?'.'+'0'.repeat(decimals):'')+suffix;
  function step(t){
    const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,3);
    node.textContent=(target*e).toFixed(decimals)+suffix;
    if(k<1)requestAnimationFrame(step); else node.textContent=numStr+suffix;
  }
  requestAnimationFrame(step);
}

function renderLog(box,items){
  box.innerHTML='';
  if(!items.length){box.appendChild(el('div',{class:'empty',text:'Brak wpisów'}));return}
  items.forEach(r=>box.appendChild(el('div',{class:'row'},[
    el('span',{class:'sdot',style:`background:${CAT_COLOR[r.cat]};width:10px;height:10px`,title:r.name}),
    el('div',{style:'min-width:0;flex:1'},[
      el('div',{class:'lead',style:'font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis',text:r.topic||'(brak tematu)'}),
      el('div',{class:'sub',text:`${r.subject} · ${r.teacher||''}`})]),
    el('div',{class:'right'},[el('div',{class:'sub',text:fmtDShort(r.date)}),el('div',{class:'faint',style:'font-size:11px',text:'lekcja '+(r.pos??'')})])
  ])));
}
function filterLog(q){
  q=q.toLowerCase().trim();
  const items=DATA.attendance.log.filter(r=>!q||(r.topic||'').toLowerCase().includes(q)||(r.subject||'').toLowerCase().includes(q));
  renderLog($('#log-box'),items.slice(0,300));
}

// ===== TIMETABLE =====
let WEEKS=[],WEEK_IDX=0;
function buildWeeks(){
  const byDate={};DATA.timetable.forEach(l=>{(byDate[l.date]=byDate[l.date]||[]).push(l)});
  const dates=Object.keys(byDate).sort();
  if(!dates.length)return{byDate:{},weeks:[]};
  const mon=s=>{const d=pd(s);const off=(d.getDay()+6)%7;d.setDate(d.getDate()-off);return iso(d)};
  let cur=mon(dates[0]);const last=mon(dates[dates.length-1]);const weeks=[];
  while(cur<=last){weeks.push(cur);const d=pd(cur);d.setDate(d.getDate()+7);cur=iso(d)}
  return{byDate,weeks};
}
function renderTimetable(){
  const v=viewBox('plan');
  v.appendChild(el('h2',{class:'view-title',text:'Plan lekcji'}));
  const {byDate,weeks}=buildWeeks();WEEKS=weeks;v._byDate=byDate;
  if(!weeks.length){v.appendChild(el('div',{class:'empty',text:'Brak planu lekcji'}));return v}
  // default: week containing today, clamped
  const t=todayISO();WEEK_IDX=weeks.findIndex(w=>{const e=pd(w);e.setDate(e.getDate()+6);return t>=w&&t<=iso(e)});
  if(WEEK_IDX<0)WEEK_IDX=t<weeks[0]?0:weeks.length-1;
  const head=el('div',{class:'tt-head'});
  head.appendChild(el('button',{class:'nav-btn',onclick:()=>{if(WEEK_IDX>0){WEEK_IDX--;drawWeek()}},text:'‹'}));
  head.appendChild(el('div',{id:'tt-label',style:'font-weight:700;min-width:230px;text-align:center'}));
  head.appendChild(el('button',{class:'nav-btn',onclick:()=>{if(WEEK_IDX<WEEKS.length-1){WEEK_IDX++;drawWeek()}},text:'›'}));
  head.appendChild(el('button',{class:'nav-btn',style:'width:auto;padding:0 14px',onclick:()=>{const i=WEEKS.findIndex(w=>{const e=pd(w);e.setDate(e.getDate()+6);return t>=w&&t<=iso(e)});WEEK_IDX=i<0?WEEK_IDX:i;drawWeek()},text:'Dziś'}));
  v.appendChild(head);
  v.appendChild(el('div',{id:'tt-grid',class:'tt-grid'}));
  v.appendChild(el('div',{class:'legend'},[
    el('span',{html:'<i style="background:var(--accent)"></i>lekcja'}),
    el('span',{html:'<i style="background:var(--warn)"></i>zastępstwo'}),
    el('span',{html:'<i style="background:var(--bad)"></i>odwołane'}),
  ]));
  setTimeout(drawWeek,0);
  return v;
}
function drawWeek(){
  const v=$('#view-plan');const byDate=v._byDate;const wk=WEEKS[WEEK_IDX];
  const start=pd(wk),days=[];
  for(let i=0;i<7;i++){const d=new Date(start);d.setDate(d.getDate()+i);days.push(iso(d))}
  // only show days that have lessons, but always Mon-Fri
  const active=days.filter((d,i)=>i<5||byDate[d]);
  const endd=days[active.length-1]||days[4];
  $('#tt-label').textContent=`${fmtDShort(wk)} – ${fmtDShort(endd)} ${pd(wk).getFullYear()}`;
  const grid=$('#tt-grid');grid.innerHTML='';grid.style.gridTemplateColumns=`repeat(${active.length},1fr)`;
  const t=todayISO();
  active.forEach((d,i)=>{
    const col=el('div',{class:'tt-col'});
    col.appendChild(el('div',{class:'tt-day'+(d===t?' today':''),html:`${PL_DAYS_S[weekday(d)]}<small>${fmtDShort(d)}</small>`}));
    const lessons=(byDate[d]||[]).slice().sort((a,b)=>(a.pos||0)-(b.pos||0));
    if(!lessons.length)col.appendChild(el('div',{class:'faint',style:'text-align:center;font-size:12px;padding:14px 0',text:'—'}));
    lessons.forEach(l=>{
      const cls='lesson'+(l.cancelled?' cancel':l.subst?' subst':'');
      col.appendChild(el('div',{class:cls},[
        el('div',{class:'t',text:`${l.start}–${l.end}`}),
        el('div',{class:'n',text:`${l.pos!=null?l.pos+'. ':''}${l.subject}`}),
        el('div',{class:'m',text:[l.room&&('sala '+l.room),l.teacher].filter(Boolean).join(' · ')}),
        l.cancelled?el('div',{class:'flag',text:'odwołane'}):l.subst?el('div',{class:'flag',text:'zastępstwo'}):null
      ]));
    });
    grid.appendChild(col);
  });
}

// ===== EXAMS =====
function examRow(e,today){
  const dd=daysBetween(today,e.date);
  let badge='', cls='badge2';
  if(e.date<today){badge='minęło';cls+=' done'}
  else if(dd===0){badge='dziś';cls+=' today'}
  else if(dd<=7){badge='za '+dd+' dni';cls+=' soon'}
  else badge='za '+dd+' dni';
  return el('div',{class:'row'},[
    el('span',{class:'sdot',style:`background:${subjColor(e.subject)};width:12px;height:12px`}),
    el('div',{style:'min-width:0;flex:1'},[
      el('div',{class:'lead',text:e.subject}),
      el('div',{class:'sub',style:'white-space:nowrap;overflow:hidden;text-overflow:ellipsis',text:`${e.type}${e.content?' · '+e.content:''}`})]),
    el('div',{class:'right'},[el('span',{class:cls,text:badge}),el('div',{class:'faint',style:'font-size:11px;margin-top:3px',text:fmtDShort(e.date)})])
  ]);
}
function renderExams(){
  const v=viewBox('exams');
  v.appendChild(el('h2',{class:'view-title',text:'Sprawdziany i kartkówki'}));
  let mode='up';
  const tabs=el('div',{class:'tabs'},[
    el('button',{class:'active',onclick:e=>{mode='up';tog(e)}},'Nadchodzące'),
    el('button',{onclick:e=>{mode='all';tog(e)}},'Wszystkie'),
  ]);
  function tog(e){tabs.querySelectorAll('button').forEach(b=>b.classList.remove('active'));e.target.classList.add('active');draw()}
  v.appendChild(tabs);
  const box=el('div');v.appendChild(box);
  const today=todayISO();
  function draw(){
    box.innerHTML='';
    let list=DATA.exams.slice();
    if(mode==='up')list=list.filter(e=>e.date>=today);
    else list=list.reverse();
    if(!list.length){box.appendChild(el('div',{class:'empty',text:'Brak sprawdzianów'}));return}
    const groups={};list.forEach(e=>{(groups[e.date]=groups[e.date]||[]).push(e)});
    Object.keys(groups).sort((a,b)=>mode==='up'?a.localeCompare(b):b.localeCompare(a)).forEach(date=>{
      const p=el('div',{class:'panel',style:'margin-bottom:14px'},[
        el('h3',{},[el('span',{class:'dot'}),`${PL_DAYS[weekday(date)]}, ${fmtD(date)}`])]);
      groups[date].forEach(e=>p.appendChild(examRow(e,today)));
      box.appendChild(p);
    });
  }
  draw();return v;
}

// ===== HOMEWORK =====
function hwRow(h,today){
  const dd=daysBetween(today,h.deadline);
  let badge,cls='badge2';
  if(h.deadline<today){badge='minęło';cls+=' done'}
  else if(dd===0){badge='dziś';cls+=' today'}
  else if(dd<=3){badge='za '+dd+' dni';cls+=' soon'}
  else badge='za '+dd+' dni';
  return el('div',{class:'row'},[
    el('span',{class:'sdot',style:`background:${subjColor(h.subject)};width:12px;height:12px`}),
    el('div',{style:'min-width:0;flex:1'},[
      el('div',{class:'lead',text:h.subject}),
      el('div',{class:'sub',text:h.content})]),
    el('div',{class:'right'},[el('span',{class:cls,text:badge}),h.attachments?el('div',{class:'faint',style:'font-size:11px;margin-top:3px',text:'📎 '+h.attachments}):null])
  ]);
}
function renderHomework(){
  const v=viewBox('hw');
  v.appendChild(el('h2',{class:'view-title',text:'Zadania domowe'}));
  if(!DATA.homework.length){v.appendChild(el('div',{class:'empty',text:'Brak zadań domowych'}));return v}
  const today=todayISO();const panel=el('div',{class:'panel'});
  DATA.homework.slice().reverse().forEach(h=>panel.appendChild(el('div',{class:'row'},[
    el('span',{class:'sdot',style:`background:${subjColor(h.subject)};width:12px;height:12px;margin-top:4px;align-self:flex-start`}),
    el('div',{style:'min-width:0;flex:1'},[
      el('div',{class:'lead',text:h.subject}),
      el('div',{class:'sub',style:'margin:2px 0',text:h.content}),
      el('div',{class:'faint',style:'font-size:11px',text:`${h.teacher} · zadano ${fmtDShort(h.assigned)}`})]),
    el('div',{class:'right'},[el('div',{class:'badge2',text:'termin '+fmtDShort(h.deadline)})])
  ])));
  v.appendChild(panel);return v;
}

// ===== NOTES =====
function renderNotes(){
  const v=viewBox('notes');
  v.appendChild(el('h2',{class:'view-title',text:'Uwagi i osiągnięcia'}));
  if(!DATA.notes.length){v.appendChild(el('div',{class:'empty',text:'Brak uwag — i bardzo dobrze 😎'}));return v}
  const grid=el('div',{class:'grid',style:'grid-template-columns:repeat(auto-fill,minmax(300px,1fr))'});
  DATA.notes.forEach(n=>grid.appendChild(el('div',{class:'note-card '+(n.positive?'pos':'neg')},[
    el('div',{class:'cat',text:(n.positive?'➕ ':'➖ ')+(n.category||'Uwaga')}),
    el('div',{class:'body',text:n.content}),
    el('div',{class:'faint',style:'font-size:12px',text:`${n.teacher} · ${fmtD(n.date)}${n.points!=null?' · '+n.points+' pkt':''}`})
  ])));
  v.appendChild(grid);return v;
}

// ===== MESSAGES =====
function renderMessages(){
  const v=viewBox('msg');
  v.appendChild(el('h2',{class:'view-title',text:'Wiadomości'}));
  v.appendChild(el('div',{class:'panel'},[el('div',{class:'locked'},[
    el('div',{html:icon('lock')}),
    el('b',{text:DATA.meta.premiumLocked?'Moduł wiadomości wymaga eduVulcan Premium':'Brak wiadomości'}),
    el('p',{text:DATA.meta.premiumLocked
      ?'Hebe API zwróciło EDUVULCAN_PREMIUM dla skrzynki i książki adresowej. Ten moduł jest dostępny tylko dla kont z aktywną subskrypcją eduVulcan Premium — pozostałe dane (oceny, frekwencja, plan, sprawdziany) pobrały się normalnie.'
      :'Skrzynka jest pusta.'})
  ])]));
  return v;
}

// ---------- boot ----------
function boot(){
  if(!DATA){document.body.innerHTML='<div class="empty">Brak danych — uruchom export.py</div>';return}
  try{const saved=localStorage.getItem('vs-theme');if(saved)document.documentElement.setAttribute('data-theme',saved);}catch(e){}
  renderHeader();renderNav();
  const box=$('#views');
  box.appendChild(renderOverview());
  box.appendChild(renderGrades());rerenderGrades();
  box.appendChild(renderAttendance());
  box.appendChild(renderTimetable());
  box.appendChild(renderExams());
  box.appendChild(renderHomework());
  box.appendChild(renderNotes());
  box.appendChild(renderMessages());
  $('#menuBtn').addEventListener('click',()=>$('#side').classList.toggle('open'));
  document.querySelectorAll('#view-overview .card.stat .v').forEach(countUp);
}
boot();
